[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smartmapper"
version = "0.1.0"
description = "Zero-dependency field & schema mapper, plus sapload: fill SAP upload templates from a legacy extract."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["schema-matching", "field-mapping", "data-integration", "etl",
            "column-mapping", "sap", "s4hana", "data-migration", "xlsx"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Database",
]
dependencies = []

[project.scripts]
smartmapper = "smartmapper.cli:main"
sapload = "sapload.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["smartmapper*", "sapload*"]
